model:
  sh_degree: 3
  feature_dim: 32
  init_from_3dgs_pcd: false
  source_path: ""
  model_path: ""
  feature_model_path: ""
  images: "images"
  resolution: 1
  white_background: false
  data_device: "cuda"
  eval: false
  allow_principle_point_shift: false
  images_path: ''
  masks_path: ''
  labels_path: ''
  point_cloud_path: ''
  contrastive_feature_point_cloud_path: ''
  sparse_path: ''
  json_path: ''
  features_path: ''
  log_path: ''

pipe:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false

optimization:
  iterations: null
  position_lr_init: 0.00016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30_000
  feature_lr: 0.0025
  instance_feature_lr: 0.01
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  std_lr: 0.01
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15_000
  densify_grad_threshold: 0.0002
  point_dropout: 0.1

  # Segmentation parameters
  mask_lr: 1.0
  optimization_times: 2
  IoU_thresh: 0.5
  IoA_thresh: 0.8
  lamb: 0.3

  # Training features
  epochs: 10
  ray_sample_rate: 0.0
  sample_rate: 0.02
  num_sampled_rays: -1
  smooth_K: 16
  scale_aware_dim: -1
  rfn: 1.
  distance_weight: 1.
  positive_weight: -1.
  negative_weight: -1.
  distance_sample_num: 1000

clustering:
  classes: ['chair', 'table', 'plant', 'flower', 'foliage', 'tv', 'painting', 'sofa', 'cabinet', 'bed', 'wall', 'floor', 'ceiling', 'person']