# Feature training stage parameters
paths:
  scene_point_cloud_path: 'output/lerf_ovs/default/scene/point_cloud.ply'
  artifacts_dir: 'output/lerf_ovs/default/feature'
  output_dir: 'output/lerf_ovs/default/feature_training'

optimizer:
  instance_feature_lr: 0.01
  semantic_feature_lr: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-15
  weight_decay: 0.0

loop:
  epochs: 10
  quiet: false
  detect_anomaly: false

loss:
  instance_weight: 1.0
  semantic_weight: 1.0
  instance_temperature: 0.1

validation:
  run_every_epochs: 1
  fallback_holdout_views: 10
  max_visualizations: 4

logging:
  enable_tensorboard: true
  write_metrics_json: true
  log_validation_images: true

checkpoint:
  save_every_epochs: 1
  keep_epoch_checkpoints: true
  save_best: true
  resume_from: null

dataloader:
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
